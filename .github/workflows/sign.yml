# Manual only. shortcuts sign needs a Mac signed into iCloud; GitHub runners are not. Kept for a future self-hosted Mac runner.
name: Sign shortcut

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint plist
        run: python3 scripts/lint_plist.py shortcuts/split-for-discord.plist

      - name: Sign
        run: |
          mkdir -p dist unsigned
          cp shortcuts/split-for-discord.plist unsigned/Split-for-Discord.shortcut
          plutil -lint unsigned/Split-for-Discord.shortcut
          set +e
          shortcuts sign --mode anyone --input unsigned/Split-for-Discord.shortcut --output dist/Split-for-Discord.shortcut > sign.log 2>&1
          rc=$?
          set -e
          echo "shortcuts sign exit=$rc"
          cat sign.log
          exit $rc

      - name: List dist
        run: ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Split-for-Discord
          path: dist/Split-for-Discord.shortcut

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/Split-for-Discord.shortcut
          fail_on_unmatched_files: true
